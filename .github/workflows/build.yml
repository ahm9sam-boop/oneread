name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Unpack project
        run: unzip -o project.zip
      - name: Bundle libraries for offline use
        run: |
          mkdir -p www/lib && cd www/lib
          curl -fsSLO https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js
          curl -fsSLO https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js
          curl -fsSLO https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js
          curl -fsSLO https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js
          cd .. && sed -i -E 's#https://cdnjs.cloudflare.com/ajax/libs/[^"]*/([A-Za-z.-]+\.js)#lib/\1#g' index.html
      - run: npm install
      - run: npx cap add android
      - name: Camera permission
        run: sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <application#' android/app/src/main/AndroidManifest.xml
      - name: Fix Min SDK for compatibility
        run: |
          sed -i 's/minSdkVersion [0-9]*/minSdkVersion 21/g' android/variables.gradle || sed -i 's/minSdk = [0-9]*/minSdk = 21/g' android/variables.gradle
      - run: npx cap sync android
      - name: Build
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: One Read v${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
